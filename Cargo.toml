[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/manager-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/zajfan/manager"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
manager-core = { path = "crates/manager-core" }
