[workspace]
resolver = "3"
# `crates/*` reaches every crate except the GUI: Tauri's own convention nests
# the Rust side one level deeper, at `crates/manager-gui/src-tauri`, so that
# path is listed explicitly.
members = ["crates/*", "crates/manager-gui/src-tauri"]
# `crates/*` would also try (and fail) to treat `crates/manager-gui` itself
# as a member: it has no `Cargo.toml` of its own, only its nested
# `src-tauri` does.
exclude = ["crates/manager-gui"]
default-members = ["crates/manager-tui"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/zajfan/manager"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tempfile = "3"
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"
# Default features drag in C libraries (bzip2, zstd) that would complicate the
# mobile builds later. Deflate covers essentially every ZIP in the wild; the
# rest are pure-Rust decoders.
zip = { version = "8", default-features = false, features = ["deflate", "deflate64", "lzma", "xz"] }
tar = "0.4"
# The default backend is pure Rust, which keeps cross-compiling simple.
flate2 = "1"
blake3 = "1"
russh = "0.63"
russh-sftp = "3"
manager-core = { path = "crates/manager-core" }
trash = "5"
