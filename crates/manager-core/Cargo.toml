[package]
name = "manager-core"
description = "The UI-independent engine of manager: VFS, listing, sorting, metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
notify.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
# Compressed archives are decompressed once into a temporary file so that
# reading an entry can seek instead of decompressing from the start again.
tempfile.workspace = true
blake3.workspace = true
thiserror.workspace = true
tokio.workspace = true

# The system trash/recycle bin. Android and iOS have no shared trash to move files into.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash.workspace = true

[dev-dependencies]
tempfile.workspace = true
blake3.workspace = true
